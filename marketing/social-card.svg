<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">MWA Music Starter</title><desc id="desc">Make music. Build something with it. An open-source starter powered by the MWA API.</desc><rect width="1280" height="640" fill="#f4f2e9"/><path d="M64 114H1216M64 544H1216" stroke="#d5d8c9"/><text x="64" y="80" font-family="Arial, sans-serif" font-size="40" font-weight="bold" letter-spacing="-3" fill="#20231b">mwa ↗</text><text x="253" y="75" font-family="monospace" font-size="13" letter-spacing="2" fill="#62675a">MUSIC STARTER</text><text x="65" y="187" font-family="monospace" font-size="13" letter-spacing="2" fill="#62675a">OPEN SOURCE. OPEN POSSIBILITIES.</text><text x="60" y="286" font-family="Arial, sans-serif" font-size="74" letter-spacing="-4" fill="#20231b">Make music.</text><text x="60" y="371" font-family="Arial, sans-serif" font-size="69" letter-spacing="-4" fill="#757b6a">Build something</text><text x="60" y="450" font-family="Arial, sans-serif" font-size="69" letter-spacing="-4" fill="#757b6a">with it.</text><rect x="815" y="157" width="401" height="342" rx="12" fill="#263020"/><g transform="translate(1016 328)" stroke="#d2fa6a" fill="none" stroke-width="1.6"><ellipse rx="157" ry="94" transform="rotate(-25)"/><ellipse rx="147" ry="82" transform="rotate(-19)"/><ellipse rx="137" ry="70" transform="rotate(-13)"/><ellipse rx="127" ry="58" transform="rotate(-7)"/><ellipse rx="117" ry="46" transform="rotate(-1)"/><ellipse rx="107" ry="34" transform="rotate(5)"/><ellipse rx="97" ry="22" transform="rotate(11)"/><ellipse rx="87" ry="10" transform="rotate(17)"/></g><circle cx="1016" cy="328" r="4" fill="#d2fa6a"/><text x="843" y="194" fill="#d2fa6a" font-family="monospace" font-size="10" letter-spacing="2">MWA / SOUND IN PROGRESS</text><text x="65" y="588" font-family="Arial, sans-serif" font-size="18" fill="#20231b">A working music app. A typed API client. Your next idea.</text><text x="1080" y="588" font-family="monospace" font-size="14" fill="#62675a">mixwithai.com</text></svg>
